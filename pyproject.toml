[project]
name = "fraud-serving"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "pyarrow>=16",
  "mlflow>=2.15",
  "databricks-sdk>=0.30",
  "lifelines>=0.29",
  "imbalanced-learn>=0.12",
  "kagglehub>=0.3",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
